# Izin Masuk Kelas SMKN 5 — diakses lewat localhost + port saja (tanpa path).
#
# CARA PASANG (di laptop Laragon):
# 1. Pastikan httpd.conf Apache memuat baris: Listen 8002
# 2. Simpan file ini sebagai:
#    C:\laragon\etc\apache2\sites-enabled\00-izin-masuk-kelas.conf
# 3. Restart Apache di Laragon (Stop lalu Start).
# 4. Buka http://localhost:8002/ — aplikasi langsung tampil.
#    Admin: http://localhost:8002/admin
#
# Port 8002 dipilih supaya tidak bentrok dengan Buku Induk (8000)
# dan Izin Keluar (8001).

<VirtualHost *:8002>
    ServerName localhost
    DocumentRoot "C:/laragon/www/izin-masuk-kelas/public"

    <Directory "C:/laragon/www/izin-masuk-kelas/public">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/izin-masuk-kelas-error.log"
    CustomLog "logs/izin-masuk-kelas-access.log" common
</VirtualHost>
